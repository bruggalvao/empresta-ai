name: spec-verification

# Backstop for the Claude Code hooks: a spec marked `Status: implementada` in a
# PR must have a verificador-spec record with verdict PRONTA that is still
# valid for the PR's code. Does not install dependencies.

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check spec verification records
        run: node scripts/spec-verification.mjs check --base "origin/${{ github.base_ref }}"
